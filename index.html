.notice{background:var(--cream);border:1px solid #eadfce;color:var(--accent);border-radius:13px;padding:11px;font-size:9px;line-height:1.5;margin-bottom:13px}
.modal-actions{display:flex;gap:8px}.modal-actions button{flex:1}
.confirm-cost{background:var(--cream);border-radius:16px;padding:15px;margin:12px 0;text-align:center}.confirm-cost strong{font-size:30px;color:var(--accent);display:block}.confirm-cost span{font-size:9px;color:#777}

.toast{position:fixed;left:50%;bottom:94px;transform:translateX(-50%) translateY(15px);background:var(--brown);color:#fff;border:1px solid rgba(232,208,153,.25);border-radius:99px;padding:10px 15px;font-size:10px;font-weight:800;z-index:200;opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center}

.empty{text-align:center;padding:40px 20px;color:#999;font-size:11px}

function escapeHtml(s){
  return String(s ?? "").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

/* ---------- Optional LIFF ---------- */
async function initLIFF(){
  if(!CONFIG.liffId || !window.liff) return false;
  try{
    await liff.init({liffId:CONFIG.liffId});
    state.liffReady = true;
    if(liff.isLoggedIn()){
      const profile = await liff.getProfile();
      state.lineId = profile.userId || "";
      return true;
    }
    return true;
  }catch(e){
    console.warn("LIFF init failed:",e);
    return false;
  }
}

/* ---------- Backend adapter ---------- */
async function gasGet(action, extra={}){
  if(!CONFIG.gasUrl) throw new Error("GAS URL is not configured");
  const params = new URLSearchParams({action,...extra});
  const res = await fetch(CONFIG.gasUrl + (CONFIG.gasUrl.includes("?")?"&":"?") + params.toString(), {method:"GET"});
  if(!res.ok) throw new Error("Backend HTTP " + res.status);
  const data = await res.json();
  if(data && data.error) throw new Error(data.error);
  return data;
}

/*
Expected backend actions:
  getMember
  getPointHistory
  getCoupons
  getRewards
  redeemReward
  useCoupon

For real production, the backend MUST verify the LINE ID token
and determine the member from the verified token. Do not trust
memberId/points supplied by the browser.
*/
async function getMemberReal(){
  const idToken = (window.liff && state.liffReady && liff.isLoggedIn()) ? liff.getIDToken() : "";
  return gasGet("getMember", {
    idToken: idToken || "",
    lineUserId: state.lineId || ""
  });
}

async function loadData(){
  state.loading=true;
  render();
  await initLIFF();

  if(CONFIG.env === "production" && CONFIG.gasUrl){
    try{
      state.member = await getMemberReal();
      const [h,c,r] = await Promise.all([
        gasGet("getPointHistory",{memberId:state.member.memberId}),
        gasGet("getCoupons",{memberId:state.member.memberId}),
        gasGet("getRewards")
      ]);
      state.history = Array.isArray(h)?h:(h.history||[]);
      state.coupons = Array.isArray(c)?c:(c.coupons||[]);
      state.rewards = Array.isArray(r)?r:(r.rewards||REWARDS);
    }catch(e){
      console.error(e);
      state.member = null;
      state.history = [];
      state.coupons = [];
      showToast("เชื่อมต่อระบบสมาชิกไม่สำเร็จ");
    }
  }else{
    loadDemo();
  }

  state.loading=false;
  render();
}

/* ---------- Rendering ---------- */
function icon(name,size=18){
  return `<i data-lucide="${name}" width="${size}" height="${size}"></i>`;
}
function render(){
  const root=document.getElementById("content");
  const loading=document.getElementById("loading");
  if(state.loading){
    loading.classList.remove("hidden"); root.classList.add("hidden"); return;
  }
  loading.classList.add("hidden"); root.classList.remove("hidden");
  root.innerHTML = pageHtml();
  if(window.lucide) lucide.createIcons();
}

  const items=[
    ["HOME","credit-card","บัตรสมาชิก"],
    ["COLLECT","trending-up","สะสมแต้ม"],
    ["REWARDS","gift","แลกพอยท์"],
    ["COUPONS","ticket","คูปอง"]

  return `<nav class="bottom">${items.map(([id,ic,label])=>`
    <button class="nav-btn ${state.page===id?"active":""}" onclick="go('${id}')">
      <div class="nav-icon">${icon(ic,18)}</div>${label}
    </button>`).join("")}</nav>`;
}

function rewards(){
  return `<div class="screen fade">

function pageHtml(){
  if(!state.member) return `<div class="error-box"><div class="error-icon">${icon("circle-alert",42)}</div><h3>ไม่พบข้อมูลสมาชิก</h3><p>กรุณาตรวจสอบการตั้งค่า หรือเชื่อมต่อระบบสมาชิกอีกครั้ง</p><button class="primary" onclick="loadData()">ลองอีกครั้ง</button></div>`;
  if(state.page==="COLLECT") return collect();
  if(state.page==="HISTORY") return historyPage();
  if(state.page==="COUPONS") return coupons();
  if(state.page==="REWARDS") return rewards();
  return home();
}

/* ---------- Actions ---------- */
function go(page){ state.page=page; render(); window.scrollTo({top:0,behavior:"smooth"}); }
function setFilter(x){state.filter=x;render();}
function showToast(msg){
  const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(showToast.timer); showToast.timer=setTimeout(()=>t.classList.remove("show"),2400);
}

function openQR(){
  const value=state.member.qrCodeValue || state.member.memberId;
  const src=CONFIG.qrProvider+"?size=260x260&margin=10&data="+encodeURIComponent(value);
  modal(`<div class="modal-head"><div class="modal-title">QR Code สมาชิกคำหวาน</div><button class="close" onclick="closeModal()">${icon("x",18)}</button></div>
    <div class="tabs"><button id="tabQr" class="active" onclick="showQRTab('qr')">QR Code</button><button id="tabBar" onclick="showQRTab('bar')">รหัสสมาชิก</button></div>
    <div id="qrTab" class="qr-wrap"><img src="${src}" alt="QR Code"><div class="code">${escapeHtml(value)}</div><div style="font-size:9px;color:#777;margin-top:8px">ยื่น QR Code นี้ให้พนักงานเพื่อสะสมคะแนน</div></div>
    <div id="barTab" class="qr-wrap hidden"><div style="font-family:monospace;font-size:22px;letter-spacing:4px;background:#fff;padding:20px;border-radius:14px">|||| ||| | |||| || |</div><div class="code">${escapeHtml(state.member.memberId)}</div><div style="font-size:9px;color:#777;margin-top:8px">รหัสสำหรับอ้างอิงสมาชิก — ยังไม่ใช่ Barcode สำหรับเครื่องสแกน</div></div>`);
}
function showQRTab(x){
  document.getElementById("qrTab").classList.toggle("hidden",x!=="qr");
  document.getElementById("barTab").classList.toggle("hidden",x!=="bar");
  document.getElementById("tabQr").classList.toggle("active",x==="qr");
  document.getElementById("tabBar").classList.toggle("active",x==="bar");
}

function confirmRedeem(id){
  const r=state.rewards.find(x=>x.id===id); if(!r)return;
  if(Number(state.member.points)<Number(r.points)){showToast("คะแนนไม่เพียงพอ");return;}
  const after=Number(state.member.points)-Number(r.points);
  modal(`<div class="modal-head"><div class="modal-title">ยืนยันการแลกพอยท์</div><button class="close" onclick="closeModal()">${icon("x",18)}</button></div>
    <div style="font-size:13px;font-weight:900">${escapeHtml(r.title)}</div>
    <div class="confirm-cost"><strong>${r.points}</strong><span>พอยท์ที่ใช้</span><div style="margin-top:10px;font-size:10px;color:#777">คะแนนปัจจุบัน ${state.member.points} → หลังแลก ${after}</div></div>
    <div class="notice">Demo Mode จะหักคะแนนและบันทึกประวัติไว้ในเครื่องนี้เท่านั้น หากเชื่อมต่อ Production ระบบควรให้ Google Apps Script เป็นผู้ตรวจสอบและตัดคะแนน</div>
    <div class="modal-actions"><button class="secondary" onclick="closeModal()">ยกเลิก</button><button class="primary" onclick="redeem('${escapeHtml(r.id)}')">ยืนยันการแลก</button></div>`);
}

async function redeem(id){
  const r=state.rewards.find(x=>x.id===id); if(!r)return;
  closeModal();
  if(CONFIG.env==="production" && CONFIG.gasUrl){
    try{
      const idToken=(window.liff&&state.liffReady&&liff.isLoggedIn())?liff.getIDToken():"";
      const result=await gasGet("redeemReward",{rewardId:r.id,idToken,memberId:state.member.memberId});
      if(result.member) state.member=result.member;
      else state.member.points=result.points;
      const h=await gasGet("getPointHistory",{memberId:state.member.memberId});
      state.history=Array.isArray(h)?h:(h.history||[]);
      showToast("แลกของรางวัลสำเร็จ");
      render(); return;
    }catch(e){console.error(e);showToast("แลกไม่สำเร็จ: "+e.message);return;}
  }
  if(Number(state.member.points)<Number(r.points))return;
  state.member.points-=Number(r.points);
  state.history.unshift({id:"DEMO-"+Date.now(),date:moneyDate(),time:nowTime(),type:"USE",description:"แลก "+r.title,points:-Number(r.points)});
  state.coupons.unshift({id:"CP-"+Date.now(),title:"คูปอง: "+r.title,description:"สร้างจากการแลก "+r.points+" พอยท์",expiry:"ใช้ภายใน 30 วัน",status:"ACTIVE",type:"REWARD"});
  saveDemo(); showToast("แลกของรางวัลสำเร็จ"); render();
}

async function useCoupon(id){
  const c=state.coupons.find(x=>x.id===id); if(!c||c.status!=="ACTIVE")return;
  modal(`<div class="modal-head"><div class="modal-title">ยืนยันการใช้คูปอง</div><button class="close" onclick="closeModal()">${icon("x",18)}</button></div>
    <div style="font-size:14px;font-weight:900">${escapeHtml(c.title)}</div>
    <div class="notice" style="margin-top:12px">เมื่อยืนยันแล้ว สถานะคูปองจะเปลี่ยนเป็น USED และไม่ควรสามารถนำกลับมาใช้ซ้ำได้</div>
    <div class="modal-actions"><button class="secondary" onclick="closeModal()">ยกเลิก</button><button class="primary" onclick="confirmUseCoupon('${escapeHtml(c.id)}')">ยืนยันใช้งาน</button></div>`);
}
async function confirmUseCoupon(id){
  closeModal();
  if(CONFIG.env==="production" && CONFIG.gasUrl){
    try{
      const idToken=(window.liff&&state.liffReady&&liff.isLoggedIn())?liff.getIDToken():"";
      await gasGet("useCoupon",{couponId:id,idToken,memberId:state.member.memberId});
      const c=state.coupons.find(x=>x.id===id); if(c)c.status="USED";
      showToast("ใช้งานคูปองสำเร็จ"); render(); return;
    }catch(e){showToast("ใช้งานคูปองไม่สำเร็จ");return;}
  }
  const c=state.coupons.find(x=>x.id===id); if(c)c.status="USED";
  saveDemo(); showToast("ใช้งานคูปองสำเร็จ"); render();
}

/* ---------- Modal ---------- */
function modal(html){
  document.getElementById("modalRoot").innerHTML=`<div class="modal" id="activeModal"><div class="modal-box">${html}</div></div>`;
  if(window.lucide)lucide.createIcons();
}
function closeModal(){document.getElementById("modalRoot").innerHTML="";}

   override ค่า CONFIG ที่กำหนดไว้ด้านบน */
localStorage.removeItem("KW_ENV");
localStorage.removeItem("KW_LIFF_ID");
localStorage.removeItem("KW_GAS_URL");
loadData();
